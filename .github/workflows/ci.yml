name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  database:
    name: pgTAP (orders RLS + ordering RPCs + inventory + purchasing + production + reporting)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP + pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl postgresql-client-16
      - name: Bootstrap auth shims (CI only)
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/bootstrap.sql
      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run pgTAP tests
        run: pg_prove --ext .sql supabase/tests/*.sql

  edge_functions:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
        working-directory: supabase/functions
      - name: Lint
        run: deno lint
        working-directory: supabase/functions
      - name: Test
        run: deno test --allow-net --allow-env
        working-directory: supabase/functions
